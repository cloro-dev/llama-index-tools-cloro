[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-tools-cloro"
version = "0.1.0"
description = "LlamaIndex tools for cloro: live Google search results, and Google AI Mode, Bing AI Mode, ChatGPT and Gemini answers with sources."
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["LlamaIndex", "cloro", "Web Search", "Google", "AI Mode", "Bing", "ChatGPT", "Gemini", "agents"]
authors = [{ name = "cloro", email = "support@cloro.dev" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = ["llama-index-core>=0.13.0,<0.15", "httpx>=0.27.0"]

[project.urls]
Homepage = "https://cloro.dev/?utm_source=llama-index-tools-cloro&utm_medium=byok"
Documentation = "https://github.com/cloro-dev/llama-index-tools-cloro#readme"
Issues = "https://github.com/cloro-dev/llama-index-tools-cloro/issues"
Source = "https://github.com/cloro-dev/llama-index-tools-cloro"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.11"]

[tool.hatch.build.targets.sdist]
include = ["llama_index/", "tests/", "LICENSE", "README.md"]

[tool.hatch.build.targets.wheel]
include = ["llama_index/"]

[tool.llamahub]
contains_example = false
import_path = "llama_index.tools.cloro"

[tool.llamahub.class_authors]
CloroToolSpec = "cloro-dev"

[tool.ruff]
line-length = 120
target-version = "py310"
